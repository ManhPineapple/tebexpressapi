version: '3.3'
services:
  redis:
    image: redis:7.0.0-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass pass
    volumes:
      - "redis:/data"
    networks:
      - tebexpress
volumes:
  redis:

networks:
  tebexpress:
    driver: bridge